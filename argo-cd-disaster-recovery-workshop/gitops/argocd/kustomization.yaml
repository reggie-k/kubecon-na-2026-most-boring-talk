# Argo CD itself, including its configuration.
# Used twice: once by `kubectl apply -k` to bootstrap a brand-new cluster,
# and afterwards by the `argocd` Application so Argo CD manages its own upgrades and settings.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  - namespace.yaml
  - https://raw.githubusercontent.com/argoproj/argo-cd/v3.5.4/manifests/install.yaml
patches:
  - path: argocd-cm.yaml
  - path: argocd-cmd-params-cm.yaml
